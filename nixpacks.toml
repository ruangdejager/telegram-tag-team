# Extends the default Node Nixpacks build with Python + Kaleido so the app can
# shell out to a small Python script for server-side Plotly figure rendering
# (see scripts/plotly_render.py). Kaleido bundles a Chromium build (~150MB) for
# offline export, so the final container is ~200MB larger than a Node-only one —
# acceptable for the map/heatmap quality gain.
#
# Nixpacks nix package identifiers must match nixpkgs exactly: `nodejs_20` (not
# `nodejs-20_x`) and `python3` (not `python312`). Wrong names silently drop the
# package instead of failing the build, which is how Python didn't end up on the
# runtime PATH in the last deploy and every /heatmap or /map click ENOENT'd.

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "python3Packages.pip"]

[phases.install]
# npm install runs automatically for Node providers, but declaring this phase
# replaces the default — so run both npm ci and the Python installs here.
# --break-system-packages is needed on newer distros where system Python is
# PEP 668-marked and pip refuses to install into it without the override.
cmds = [
  "npm ci",
  "python3 -m pip install --break-system-packages --no-cache-dir 'plotly==5.24.1' 'kaleido==0.2.1'",
]

[start]
cmd = "node src/index.js"
